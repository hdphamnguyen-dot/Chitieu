<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Chi Tiêu Thông Minh</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Quản Lý Chi Tiêu</h1>
            <p>Nhập giao dịch bằng văn bản hoặc ảnh hóa đơn</p>
            <div class="tabs">
                <button class="tab active">Trang Chủ</button>
                <button class="tab">Biểu Đồ</button>
                <button class="tab">Cài Đặt AI</button>
            </div>
        </div>

        <div id="main-tab" class="content tab-content active">
            <div class="summary-cards">
                <div class="card"><h3>Tổng Thu</h3><div class="amount" id="totalIncome">0 ₫</div></div>
                <div class="card"><h3>Tổng Chi</h3><div class="amount" id="totalExpense">0 ₫</div></div>
                <div class="card"><h3>Số Dư</h3><div class="amount" id="balance">0 ₫</div></div>
            </div>

            <div class="input-section">
                <div class="input-group">
                    <label>Nhập nội dung:</label>
                    <textarea id="naturalInput" placeholder="Ví dụ: Ăn sáng 30k"></textarea>
                </div>
                <div class="input-group">
                    <label>Tải ảnh:</label>
                    <div class="image-upload-area" id="uploadArea">📸 Kéo thả ảnh vào đây</div>
                    <input type="file" id="imageInput" accept="image/*" multiple style="display: none;">
                    <div class="image-preview" id="imagePreview"></div>
                </div>
                <button id="processBtn">Xử Lý Giao Dịch</button>
            </div>
            <div id="message"></div>
            
            <div class="transactions">
                <h2>Lịch Sử Giao Dịch</h2>
                <div class="transaction-header">
                    <span>Ngày</span>
                    <span>Hạng mục</span>
                    <span>Mô tả</span>
                    <span class="text-right">Số tiền</span>
                    <span class="text-center">Xóa</span>
                </div>
                <div id="transactionList"></div>
            </div>
        </div>

        <div id="charts-tab" class="content tab-content">...</div>
        <div id="settings-tab" class="content tab-content">...</div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
