<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Chi Tiêu Thông Minh</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Quản Lý Chi Tiêu Thông Minh</h1>
            <p>Nhập giao dịch bằng ngôn ngữ tự nhiên hoặc ảnh hóa đơn</p>
            <div class="tabs">
                <button class="tab active">Trang Chủ</button>
                <button class="tab">Biểu Đồ</button>
                <button class="tab">Cài Đặt AI</button>
            </div>
        </div>

        <div id="main-tab" class="content tab-content active">
            <div class="summary-cards">
                <div class="card"><h3>Tổng Thu Nhập</h3><div class="amount" id="totalIncome">0 ₫</div></div>
                <div class="card"><h3>Tổng Chi Tiêu</h3><div class="amount" id="totalExpense">0 ₫</div></div>
                <div class="card"><h3>Số Dư</h3><div class="amount" id="balance">0 ₫</div></div>
            </div>

            <div class="input-section">
                <div class="input-group">
                    <label>Nhập giao dịch:</label>
                    <textarea id="naturalInput" placeholder="VD: Hôm nay tôi có thu nhập 2 triệu từ lương"></textarea>
                </div>
                <div class="input-group">
                    <label>Tải ảnh hóa đơn:</label>
                    <div class="image-upload-area" id="uploadArea">📸 Kéo thả hoặc nhấn để chọn ảnh</div>
                    <input type="file" id="imageInput" accept="image/*" multiple style="display: none;">
                    <div class="image-preview" id="imagePreview"></div>
                </div>
                <button id="processBtn">Xử Lý Giao Dịch</button>
            </div>
            <div id="message"></div>
            <div class="transactions">
                <h2>Lịch Sử Giao Dịch</h2>
                <div id="transactionList"></div>
            </div>
        </div>

        <div id="charts-tab" class="content tab-content">
            <h2>Biểu Đồ Thống Kê</h2>
            <select id="chartFilter">
                <option value="all">Tất cả thời gian</option>
                <option value="7">7 ngày qua</option>
                <option value="30">30 ngày qua</option>
            </select>
            <div class="charts-grid">
                <div class="chart-container"><canvas id="incomeExpenseChart"></canvas></div>
                <div class="chart-container"><canvas id="categoryPieChart"></canvas></div>
                <div class="chart-container"><canvas id="trendChart"></canvas></div>
                <div class="chart-container"><canvas id="topCategoriesChart"></canvas></div>
            </div>
        </div>

        <div id="settings-tab" class="content tab-content">
            <div class="settings-section">
                <h3>Google Gemini API <span class="api-status disconnected" id="geminiStatus">Chưa kết nối</span></h3>
                <input type="password" id="geminiKey" placeholder="Nhập API Key Gemini">
                <select id="geminiModel" disabled><option value="">Chọn model...</option></select>
                <button id="geminiTestBtn">Kiểm Tra Gemini</button>
            </div>
            <div class="settings-section">
                <h3>OpenRouter API <span class="api-status disconnected" id="openrouterStatus">Chưa kết nối</span></h3>
                <input type="password" id="openrouterKey" placeholder="Nhập API Key OpenRouter">
                <select id="openrouterModel" disabled><option value="">Chọn model...</option></select>
                <button id="openrouterTestBtn">Kiểm Tra OpenRouter</button>
            </div>
            <div class="settings-section">
                <label>API Sử Dụng:</label>
                <select id="activeProvider">
                    <option value="">Chưa chọn</option>
                    <option value="gemini">Google Gemini</option>
                    <option value="openrouter">OpenRouter</option>
                </select>
            </div>
            <button id="saveSettingsBtn">Lưu Cài Đặt</button>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
